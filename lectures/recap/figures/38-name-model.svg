<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Embeddings feed an ordinary MLP" style="font-family:Avenir Next,Segoe UI,sans-serif"><rect x="15" y="140" width="190" height="78" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="110.0" y="188.1" font-size="26" fill="#245EDB" text-anchor="middle" font-weight="500">5 IDs</text><text x="110" y="270" font-size="24" fill="#4A5160" text-anchor="middle" font-weight="500">B × 5</text><line x1="210" y1="180" x2="234" y2="180" stroke="#245EDB" stroke-width="2.5" stroke-dasharray=""/><path d="M 226 175 L 234 180 L 226 185" fill="none" stroke="#245EDB" stroke-width="2" transform="rotate(0.0 234 180)"/><rect x="239" y="140" width="190" height="78" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="334.0" y="188.1" font-size="26" fill="#245EDB" text-anchor="middle" font-weight="500">Embedding</text><text x="334" y="270" font-size="24" fill="#4A5160" text-anchor="middle" font-weight="500">B × 5 × 4</text><line x1="434" y1="180" x2="458" y2="180" stroke="#245EDB" stroke-width="2.5" stroke-dasharray=""/><path d="M 450 175 L 458 180 L 450 185" fill="none" stroke="#245EDB" stroke-width="2" transform="rotate(0.0 458 180)"/><rect x="463" y="140" width="190" height="78" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="558.0" y="188.1" font-size="26" fill="#245EDB" text-anchor="middle" font-weight="500">Flatten</text><text x="558" y="270" font-size="24" fill="#4A5160" text-anchor="middle" font-weight="500">B × 20</text><line x1="658" y1="180" x2="682" y2="180" stroke="#245EDB" stroke-width="2.5" stroke-dasharray=""/><path d="M 674 175 L 682 180 L 674 185" fill="none" stroke="#245EDB" stroke-width="2" transform="rotate(0.0 682 180)"/><rect x="687" y="140" width="190" height="78" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="782.0" y="188.1" font-size="26" fill="#245EDB" text-anchor="middle" font-weight="500">Hidden</text><text x="782" y="270" font-size="24" fill="#4A5160" text-anchor="middle" font-weight="500">B × 64</text><line x1="882" y1="180" x2="906" y2="180" stroke="#245EDB" stroke-width="2.5" stroke-dasharray=""/><path d="M 898 175 L 906 180 L 898 185" fill="none" stroke="#245EDB" stroke-width="2" transform="rotate(0.0 906 180)"/><rect x="911" y="140" width="190" height="78" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="1006.0" y="188.1" font-size="26" fill="#245EDB" text-anchor="middle" font-weight="500">Logits</text><text x="1006" y="270" font-size="24" fill="#4A5160" text-anchor="middle" font-weight="500">B × V</text><text x="560" y="65" font-size="30" fill="#14171F" text-anchor="middle" font-weight="500">A next-character model is a classifier at every step</text><text x="560" y="360" font-size="26" fill="#245EDB" text-anchor="middle" font-weight="500">V is the vocabulary size; the embedding table is learned.</text></svg>