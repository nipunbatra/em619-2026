<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Three operations with different jobs" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">PyTorch call</text><text x="400" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Job</text><text x="790" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Common mistake</text><line x1="30" y1="45.75" x2="1090" y2="45.75" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">optimizer.zero_grad()</text><text x="400" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Clear stored parameter</text><text x="400" y="106.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">gradients</text><text x="790" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Accidental batch</text><text x="790" y="106.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">accumulation</text><line x1="30" y1="124.63" x2="1090" y2="124.63" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="155.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">loss.backward()</text><text x="400" y="155.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Compute / accumulate</text><text x="400" y="185.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">gradients</text><text x="790" y="155.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Expecting weights to</text><text x="790" y="185.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">change</text><line x1="30" y1="203.51" x2="1090" y2="203.51" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="234.51" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">optimizer.step()</text><text x="400" y="234.51" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Update model parameters</text><text x="790" y="234.51" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Updating before</text><text x="790" y="263.95" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">backward</text><line x1="30" y1="282.39" x2="1090" y2="282.39" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="313.39" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">torch.no_grad()</text><text x="400" y="313.39" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Disable graph recording in</text><text x="400" y="342.83" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">its scope</text><text x="790" y="313.39" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Confusing it with</text><text x="790" y="342.83" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">model.eval()</text><line x1="30" y1="361.27" x2="1090" y2="361.27" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>