<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Ridge trades training fit for smaller coefficients" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Term</text><text x="640" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Role</text><line x1="30" y1="45.75" x2="1090" y2="45.75" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">(1/n) Σ(yᵢ − ŷᵢ)²</text><text x="640" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Fit the training targets</text><line x1="30" y1="95.19" x2="1090" y2="95.19" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">λ Σⱼ wⱼ²</text><text x="640" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Penalize large feature coefficients</text><line x1="30" y1="144.63" x2="1090" y2="144.63" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Choose λ using validation</text><text x="640" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Control the strength of shrinkage</text><line x1="30" y1="194.07" x2="1090" y2="194.07" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="225.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Scale using training data</text><text x="640" y="225.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Make feature units comparable</text><line x1="30" y1="243.51" x2="1090" y2="243.51" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>