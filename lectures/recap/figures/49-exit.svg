<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Five questions for any predictive model" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="22" fill="#245EDB" text-anchor="start" font-weight="650">Question</text><text x="610" y="26.0" font-size="22" fill="#245EDB" text-anchor="start" font-weight="650">Recall the connection</text><line x1="30" y1="44.5" x2="1090" y2="44.5" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="74.5" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">What exactly is the target?</text><text x="610" y="74.5" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Regression, classification, next</text><text x="610" y="102.66" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">character</text><line x1="30" y1="120.82" x2="1090" y2="120.82" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="150.82" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Where does flexibility come from?</text><text x="610" y="150.82" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Depth, basis functions, hidden features</text><line x1="30" y1="168.98" x2="1090" y2="168.98" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="198.98" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">What is being minimized?</text><text x="610" y="198.98" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Squared error, impurity, cross-entropy</text><line x1="30" y1="217.14" x2="1090" y2="217.14" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="247.14" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">How do parameters change?</text><text x="610" y="247.14" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Splits, a solver, gradient + optimizer</text><line x1="30" y1="265.29999999999995" x2="1090" y2="265.29999999999995" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="295.29999999999995" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">What evidence shows it generalizes?</text><text x="610" y="295.29999999999995" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">A sound split and held-out evaluation</text><line x1="30" y1="313.4599999999999" x2="1090" y2="313.4599999999999" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>