<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="How much data supplies one gradient?" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Method</text><text x="340" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Examples per update</text><text x="690" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Trade-off</text><line x1="30" y1="45.75" x2="1090" y2="45.75" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Full batch</text><text x="340" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">All training examples</text><text x="690" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Accurate full-data gradient</text><line x1="30" y1="95.19" x2="1090" y2="95.19" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Stochastic</text><text x="340" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">One sampled example</text><text x="690" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Noisy, inexpensive updates</text><line x1="30" y1="144.63" x2="1090" y2="144.63" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Mini-batch</text><text x="340" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">A subset of examples</text><text x="690" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Efficient vectorized updates</text><line x1="30" y1="194.07" x2="1090" y2="194.07" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>