<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Random forests and boosting" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Method</text><text x="300" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">How models differ</text><text x="730" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">How predictions combine</text><line x1="30" y1="45.75" x2="1090" y2="45.75" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Bagging</text><text x="300" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Bootstrap training sets</text><text x="730" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Vote / average</text><line x1="30" y1="95.19" x2="1090" y2="95.19" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Random forest</text><text x="300" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Bootstrap + feature subsets</text><text x="730" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Vote / average</text><line x1="30" y1="144.63" x2="1090" y2="144.63" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Boosting</text><text x="300" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Fit sequentially to current</text><text x="300" y="205.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">errors</text><text x="730" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Weighted / additive model</text><line x1="30" y1="223.51" x2="1