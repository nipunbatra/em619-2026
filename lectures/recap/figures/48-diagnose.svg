<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Diagnose the mistake before choosing a bigger model" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="22" fill="#245EDB" text-anchor="start" font-weight="650">Observation</text><text x="580" y="26.0" font-size="22" fill="#245EDB" text-anchor="start" font-weight="650">First question</text><line x1="30" y1="44.5" x2="1090" y2="44.5" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="74.5" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Training 100%, validation poor</text><text x="580" y="74.5" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Too much flexibility, or leakage in the</text><text x="580" y="102.66" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">protocol?</text><line x1="30" y1="120.82" x2="1090" y2="120.82" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="150.82" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Huge opposite regression weights</text><text x="580" y="150.82" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Correlated or duplicate feature columns?</text><line x1="30" y1="168.98" x2="1090" y2="168.98" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="198.98" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">MLP behaves like a straight line</text><text x="580" y="198.98" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Were the nonlinear activations omitted?</text><line x1="30" y1="217.14" x2="1090" y2="217.14" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="247.14" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Loss explodes after an update</text><text x="580" y="247.14" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Learning rate, scaling or gradient</text><text x="580" y="275.3" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">problem?</text><line x1="30" y1="293.46" x2="1090" y2="293.46" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="323.46" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Names repeat training examples</text><text x="580" y="323.46" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">Was evaluation split by name before</text><text x="580" y="351.62" font-size="22" fill="#14171F" text-anchor="start" font-weight="500">windows?</text><line x1="30" y1="369.78" x2="1090" y2="369.78" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>