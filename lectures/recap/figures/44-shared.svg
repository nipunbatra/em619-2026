<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="A reused value receives both contributions" style="font-family:Avenir Next,Segoe UI,sans-serif"><rect x="40" y="160" width="150" height="70" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="115.0" y="203.75" font-size="25" fill="#245EDB" text-anchor="middle" font-weight="500">x = 3</text><line x1="190" y1="177" x2="430" y2="190" stroke="#245EDB" stroke-width="2.5" stroke-dasharray=""/><path d="M 422 185 L 430 190 L 422 195" fill="none" stroke="#245EDB" stroke-width="2" transform="rotate(3.10049144980778 430 190)"/><line x1="190" y1="218" x2="430" y2="225" stroke="#245EDB" stroke-width="2.5" stroke-dasharray=""/><path d="M 422 220 L 430 225 L 422 230" fill="none" stroke="#245EDB" stroke-width="2" transform="rotate(1.6706532713999678 430 225)"/><rect x="430" y="165" width="220" height="80" rx="7" fill="#E4ECFF" stroke="#245EDB" stroke-width="2"/><text x="540.0" y="213.75" font-size="25" fill="#245EDB" text-anchor="middle" font-weight="500">f = x × x = 9</text><text x="760" y="160" font-size="33" fill="#14171F" text-anchor="start" font-weight="500">Two paths to x</text><text x="760" y="235" font-size="30" fill="#245EDB" text-anchor="start" font-weight="500">∂f/∂x = x + x = 6</text><text x="170" y="80" font-size="29" fill="#4A5160" text-anchor="start" font-weight="500">Each use contributes a gradient; add both.</text></svg>