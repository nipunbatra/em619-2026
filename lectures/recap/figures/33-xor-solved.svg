<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Two ReLU features solve the four XOR corners" style="font-family:Avenir Next,Segoe UI,sans-serif"><line x1="65" y1="345" x2="505" y2="345" stroke="#4A5160" stroke-width="2.5" stroke-dasharray=""/><path d="M 497 340 L 505 345 L 497 350" fill="none" stroke="#4A5160" stroke-width="2" transform="rotate(0.0 505 345)"/><line x1="65" y1="345" x2="65" y2="65" stroke="#4A5160" stroke-width="2.5" stroke-dasharray=""/><path d="M 57 60 L 65 65 L 57 70" fill="none" stroke="#4A5160" stroke-width="2" transform="rotate(-90.0 65 65)"/><text x="505" y="380" font-size="23" fill="#4A5160" text-anchor="end" font-weight="500">x₁</text><text x="50" y="53" font-size="23" fill="#4A5160" text-anchor="start" font-weight="500">x₂</text><circle cx="140" cy="295" r="19" fill="#BE123C"/><text x="173" y="303" font-size="27" fill="#14171F" text-anchor="start" font-weight="500">0</text><circle cx="140" cy="100" r="19" fill="#245EDB"/><text x="173" y="108" font-size="27" fill="#14171F" text-anchor="start" font-weight="500">1</text><circle cx="410" cy="295" r="19" fill="#245EDB"/><text x="443" y="303" font-size="27" fill="#14171F" text-anchor="start" font-weight="500">1</text><circle cx="410" cy="100" r="19" fill="#BE123C"/><text x="443" y="108" font-size="27" fill="#14171F" text-anchor="start" font-weight="500">0</text><line x1="70" y1="245" x2="350" y2="50" stroke="#245EDB" stroke-width="3" stroke-dasharray="8 5"/><line x1="220" y1="345" x2="500" y2="150" stroke="#245EDB" stroke-width="3" stroke-dasharray="8 5"/><text x="620" y="95" font-size="30" fill="#245EDB" text-anchor="start" font-weight="500">h₁ = ReLU(x₁ + x₂)</text><text x="620" y="160" font-size="30" fill="#245EDB" text-anchor="start" font-weight="500">h₂ = ReLU(x₁ + x₂ − 1)</text><text x="620" y="255" font-size="38" fill="#14171F" text-anchor="start" font-weight="500">ŷ = h₁ − 2h₂</text><text x="620" y="340" font-size="23" fill="#4A5160" text-anchor="start" font-weight="500">Outputs at the four corners: 0, 1, 1, 0</text></svg>