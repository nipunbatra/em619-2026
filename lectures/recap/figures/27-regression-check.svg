<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Three ways to control a regression model" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Model</text><text x="340" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Representation</text><text x="750" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">A setting to validate</text><line x1="30" y1="45.75" x2="1090" y2="45.75" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Regression tree</text><text x="340" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Regions and leaf means</text><text x="750" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Depth / minimum leaf size</text><line x1="30" y1="95.19" x2="1090" y2="95.19" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Basis regression</text><text x="340" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Chosen feature functions</text><text x="750" y="126.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Basis complexity</text><line x1="30" y1="144.63" x2="1090" y2="144.63" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Ridge regression</text><text x="340" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Weighted feature sum</text><text x="750" y="175.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Penalty λ</text><line x1="30" y1="194.07" x2="1090" y2="194.07" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>