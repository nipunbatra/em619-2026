<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="Automatic differentiation is not finite differencing" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Method</text><text x="360" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">How the derivative is obtained</text><text x="820" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Main limitation</text><line x1="30" y1="45.75" x2="1090" y2="45.75" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Finite differences</text><text x="360" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Perturb inputs and re-evaluate</text><text x="820" y="76.75" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Step size,</text><text x="820" y="106.19" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">cancellation, cost</text><line x1="30" y1="124.63" x2="1090" y2="124.63" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="155.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Symbolic</text><text x="40" y="185.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">differentiation</text><text x="360" y="155.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Manipulate expressions</text><text x="820" y="155.63" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Expression growth /</text><text x="820" y="185.07" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">representation</text><line x1="30" y1="203.51" x2="1090" y2="203.51" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="234.51" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Reverse-mode autodiff</text><text x="360" y="234.51" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Local rules in reverse graph order</text><text x="820" y="234.51" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Must retain or</text><text x="820" y="263.95" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">recover</text><text x="820" y="293.39" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">intermediates</text><line x1="30" y1="311.83" x2="1090" y2="311.83" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>