<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="The denominator changes the question" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="335" y="34" font-size="25" fill="#4A5160" text-anchor="middle" font-weight="500">Predicted label</text><text x="245" y="80" font-size="24" fill="#245EDB" text-anchor="middle" font-weight="500">positive</text><text x="455" y="80" font-size="24" fill="#245EDB" text-anchor="middle" font-weight="500">negative</text><rect x="145" y="100" width="200" height="100" rx="7" fill="#DCF0EA" stroke="#0F766E" stroke-width="2"/><text x="245.0" y="160.5" font-size="30" fill="#0F766E" text-anchor="middle" font-weight="500">TP = 18</text><rect x="355" y="100" width="200" height="100" rx="7" fill="#FBE9EE" stroke="#BE123C" stroke-width="2"/><text x="455.0" y="160.5" font-size="30" fill="#BE123C" text-anchor="middle" font-weight="500">FN = 2</text><rect x="145" y="220" width="200" height="100" rx="7" fill="#FBE9EE" stroke="#BE123C" stroke-width="2"/><text x="245.0" y="280.5" font-size="30" fill="#BE123C" text-anchor="middle" font-weight="500">FP = 12</text><rect x="355" y="220" width="200" height="100" rx="7" fill="#DCF0EA" stroke="#0F766E" stroke-width="2"/><text x="455.0" y="280.5" font-size="30" fill="#0F766E" text-anchor="middle" font-weight="500">TN = 68</text><text x="125" y="158" font-size="22" fill="#4A5160" text-anchor="end" font-weight="500">positive</text><text x="125" y="278" font-size="22" fill="#4A5160" text-anchor="end" font-weight="500">negative</text><text x="30" y="370" font-size="23" fill="#4A5160" text-anchor="start" font-weight="500">Actual labels are the rows.</text><text x="640" y="115" font-size="29" fill="#245EDB" text-anchor="start" font-weight="500">Precision = 18 / 30 = 0.60</text><text x="640" y="205" font-size="29" fill="#245EDB" text-anchor="start" font-weight="500">Recall = 18 / 20 = 0.90</text><text x="640" y="295" font-size="29" fill="#14171F" text-anchor="start" font-weight="500">Accuracy = 86 / 100 = 0.86</text><text x="640" y="370" font-size="23" fill="#4A5160" text-anchor="start" font-weight="500">100 illustrative examples</text></svg>