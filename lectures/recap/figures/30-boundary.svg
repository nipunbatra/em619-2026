<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410" role="img" aria-label="A threshold turns probabilities into decisions" style="font-family:Avenir Next,Segoe UI,sans-serif"><text x="40" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Rule</text><text x="420" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Boundary in score z</text><text x="760" y="26.0" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">Effect of increasing</text><text x="760" y="54.75" font-size="23" fill="#245EDB" text-anchor="start" font-weight="650">threshold</text><line x1="30" y1="74.5" x2="1090" y2="74.5" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="105.5" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Predict 1 when p ≥ 0.5</text><text x="420" y="105.5" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">z ≥ 0</text><text x="760" y="105.5" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Default example</text><line x1="30" y1="123.94" x2="1090" y2="123.94" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="154.94" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Predict 1 when p ≥ 0.8</text><text x="420" y="154.94" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">z ≥ ln(4) ≈ 1.386</text><text x="760" y="154.94" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Fewer positive</text><text x="760" y="184.38" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">predictions</text><line x1="30" y1="202.82" x2="1090" y2="202.82" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/><text x="40" y="233.82" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">On the same scored examples</text><text x="420" y="233.82" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Move the cutoff</text><text x="760" y="233.82" font-size="23" fill="#14171F" text-anchor="start" font-weight="500">Recall cannot increase</text><line x1="30" y1="252.26" x2="1090" y2="252.26" stroke="#D9DDE5" stroke-width="2" stroke-dasharray=""/></svg>