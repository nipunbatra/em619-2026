project:
  type: website
  output-dir: docs
  resources:
    - "cheatsheets/*.pdf"
    - "lectures/recap/index.html"
    - "lectures/recap/em619-course-recap.pdf"
    - "lectures/recap/TEACHING_GUIDE.md"
  render:
    - index.qmd
    - schedule.qmd
    - grading.qmd
    - faq.qmd

website:
  title: "EM 619: Machine Learning for Predictive Analysis"
  description: "EM 619 (MLPA) — part of the e-Masters in Data Science for Decision Making (DSDM) at IIT Gandhinagar"
  favicon: favicon.svg
  open-graph: true
  navbar:
    background: "#ffffff"
    foreground: "#333333"
    title: "EM 619 · MLPA"
    right:
      - href: index.qmd
        text: Home
      - href: schedule.qmd
        text: Lectures
      - href: grading.qmd
        text: Evaluation
      - href: faq.qmd
        text: FAQ
      - href: https://nipunbatra.github.io
        text: Instructor
  page-footer:
    left: "EM 619: Machine Learning for Predictive Analysis | IIT Gandhinagar"
    center: "© 2026 Nipun Batra"
    right: "Made with [Quarto](https://quarto.org) | [Prof. Nipun Batra](https://nipunbatra.github.io)"
    background: "#FAFBFC"

format:
  html:
    theme: [cosmo, styles.scss]
    include-after-body: course-tools.html
    toc: false
    page-layout: full
    smooth-scroll: true
    highlight-style: github
    mainfont: "-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif"
    monofont: "JetBrains Mono, Monaco, Consolas, monospace"
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true
    fig-responsive: true

execute:
  freeze: auto
